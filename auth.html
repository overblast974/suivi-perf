<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#6366f1">
    <title>TrainSmart - Connexion</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="auth.css">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1 class="logo">TrainSmart</h1>
                <p class="tagline">Entraînement intelligent avec analyse scientifique</p>
            </div>

            <!-- Login Form -->
            <div id="loginForm" class="auth-form active">
                <h2>Connexion</h2>
                <form id="loginFormElement">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="loginEmail" class="input" placeholder="votre@email.com" required autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label>Mot de passe</label>
                        <input type="password" id="loginPassword" class="input" placeholder="••••••••" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn-primary btn-full">Se connecter</button>
                </form>
                <p class="auth-switch">
                    Pas encore de compte ?
                    <button class="link-btn" id="showSignupBtn">Créer un compte</button>
                </p>
            </div>

            <!-- Signup Form -->
            <div id="signupForm" class="auth-form">
                <h2>Créer un compte</h2>
                <form id="signupFormElement">
                    <div class="form-group">
                        <label>Nom complet</label>
                        <input type="text" id="signupName" class="input" placeholder="Jean Dupont" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="signupEmail" class="input" placeholder="votre@email.com" required autocomplete="email">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Âge</label>
                            <input type="number" id="signupAge" class="input" placeholder="30" min="10" max="100" required>
                        </div>
                        <div class="form-group">
                            <label>Sexe</label>
                            <select id="signupGender" class="input" required>
                                <option value="">Sélectionner</option>
                                <option value="male">Homme</option>
                                <option value="female">Femme</option>
                                <option value="other">Autre</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Poids (kg)</label>
                            <input type="number" id="signupWeight" class="input" placeholder="75" step="0.1" min="30" max="300">
                        </div>
                        <div class="form-group">
                            <label>Taille (cm)</label>
                            <input type="number" id="signupHeight" class="input" placeholder="175" min="100" max="250">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Mot de passe</label>
                        <input type="password" id="signupPassword" class="input" placeholder="••••••••" required autocomplete="new-password" minlength="6">
                        <small>Minimum 6 caractères</small>
                    </div>
                    <div class="form-group">
                        <label>Confirmer le mot de passe</label>
                        <input type="password" id="signupPasswordConfirm" class="input" placeholder="••••••••" required autocomplete="new-password">
                    </div>
                    <button type="submit" class="btn-primary btn-full">Créer mon compte</button>
                </form>
                <p class="auth-switch">
                    Déjà un compte ?
                    <button class="link-btn" id="showLoginBtn">Se connecter</button>
                </p>
            </div>

            <div id="authMessage" class="auth-message"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="auth.js"></script>
</body>
</html>
