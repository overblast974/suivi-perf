<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="url(#gradient)"/>

  <!-- Dumbbell icon -->
  <g transform="translate(256, 256)">
    <!-- Left weight -->
    <rect x="-180" y="-40" width="60" height="80" rx="8" fill="white"/>
    <!-- Left bar -->
    <rect x="-120" y="-15" width="50" height="30" rx="4" fill="white"/>
    <!-- Center bar -->
    <rect x="-70" y="-10" width="140" height="20" rx="4" fill="white"/>
    <!-- Right bar -->
    <rect x="70" y="-15" width="50" height="30" rx="4" fill="white"/>
    <!-- Right weight -->
    <rect x="120" y="-40" width="60" height="80" rx="8" fill="white"/>
  </g>

  <!-- Stats line -->
  <g transform="translate(256, 380)">
    <circle cx="-60" cy="0" r="6" fill="white" opacity="0.7"/>
    <circle cx="-20" cy="-10" r="6" fill="white" opacity="0.7"/>
    <circle cx="20" cy="5" r="6" fill="white" opacity="0.7"/>
    <circle cx="60" cy="-15" r="6" fill="white" opacity="0.7"/>
    <polyline points="-60,0 -20,-10 20,5 60,-15" stroke="white" stroke-width="3" fill="none" opacity="0.7"/>
  </g>
</svg>
